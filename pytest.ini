[pytest]
testpaths = tests
asyncio_mode = auto
cache_dir = tests/artifacts/pytest_cache
markers =
    integration: 需要 Redis/PostgreSQL/ChromaDB
    unit: 纯逻辑测试，无外部依赖

# P3 #26 修复：启用覆盖率测量
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html:tests/artifacts/coverage/htmlcov
    --cov-report=xml:tests/artifacts/coverage/coverage.xml
    --cov-config=tests/.coveragerc
    --no-cov-on-fail
