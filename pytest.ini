[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: 需要 Redis/PostgreSQL/ChromaDB
    unit: 纯逻辑测试，无外部依赖

# P3 #26 修复：启用覆盖率测量
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-config=.coveragerc
    --no-cov-on-fail
markersslowapi = skip

[coverage:run]
# 覆盖率配置
source =
    agents
    channels
    communication
    models
    observability
    security
    storage
    tools
    workflows
    main.py

# 排除不需要覆盖的代码
omit =
    */__pycache__/*
    */tests/*
    */venv/*
    */__init__.py
    */migrations/*

[coverage:report]
# 覆盖率目标
# 失败阈值：CI 低于此值会失败
fail_under = 30

# 排除行
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod

# 报告精度
precision = 1
show_missing = True
skip_covered = 100
