# 项目模板 - 定义任务阶段约束
# LLM 在此框架内自由拆解具体任务
# 注意：没有 PM 角色，CEO 直接输出详细任务描述给 Developer

# 阶段定义（按顺序执行）
phases:
  - name: "设计与开发"
    required_agents: ["developer"]
    optional_agents: ["frontend_expert"]
    description: "根据客户需求进行设计和代码实现。CEO 提供详细的任务描述，Developer 直接理解和实现"
    can_parallel: true

  - name: "部署"
    required_agents: ["devops"]
    optional_agents: []
    description: "部署应用到生产环境，配置监控"
    can_parallel: false

  - name: "结算"
    required_agents: ["finance"]
    optional_agents: []
    description: "记录项目成本，生成账单和财务报表"
    can_parallel: false

# Agent 能力描述（供 LLM 拆解时参考）
agent_capabilities:
  developer:
    name: "开发工程师"
    capabilities: |
      根据模糊需求自主设计方案并实现。能处理不完整的需求，遇到关键决策会主动提问。
      调用 Claude Code 构建实际可运行的产品，包括：架构设计、代码实现、项目配置、README。
    output: "可运行的代码项目 + 成果摘要文档"
    sync: false  # 复杂任务，异步执行
    task_timeout: 900  # 15 分钟

  frontend_expert:
    name: "前端专家"
    capabilities: |
      根据需求设计并实现高质量前端页面。使用 Next.js + Tailwind CSS + shadcn/ui 技术栈。
      能从口头需求生成美观、响应式、可生产的前端代码，包含完整项目结构和组件。
    output: "可运行的前端项目 + 成果摘要文档"
    sync: false  # 复杂任务，异步执行
    task_timeout: 900  # 15 分钟

  devops:
    name: "运维工程师"
    capabilities: "部署应用、配置监控、生成部署报告"
    output: "部署报告"
    sync: true
    task_timeout: 300  # 5 分钟

  finance:
    name: "财务人员"
    capabilities: "成本记录、账单生成、财务报表"
    output: "财务报告和账单"
    sync: true
    task_timeout: 120  # 2 分钟

# 任务拆解规则
decomposition_rules:
  - "CEO 负责将模糊的客户需求转化为清晰、具体的任务描述"
  - "每个阶段至少有一个任务"
  - "required_agents 中的每个 Agent 必须被分配任务"
  - "optional_agents 可根据需求决定是否参与"
  - "任务之间通过 dependencies 字段定义依赖关系"
  - "同一阶段内 can_parallel=true 的任务可以并行执行"
  - "下一阶段的任务必须依赖上一阶段的任务完成"
  - "给 Developer 的任务描述必须包含：要做什么、包含哪些功能、页面/模块结构、技术要求"
