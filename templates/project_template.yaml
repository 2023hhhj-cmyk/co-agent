# 角色能力目录
# CEO 先根据上下文写需求文档，再按文档决定派哪些角色。
# 这里不规定阶段，也不要求每次都派出全部角色。

agent_capabilities:
  developer:
    name: "开发工程师"
    capabilities: |
      执行 CEO 分配的一项开发任务，在客户目录中实现该任务描述的功能。
      不负责拆分整个项目，也不决定下一步派给谁。
    output: "该任务要求的代码或文件"

  frontend_expert:
    name: "前端专家"
    capabilities: |
      执行 CEO 分配的一项前端任务。使用 Next.js + Tailwind CSS + shadcn/ui，
      在客户目录中完成指定页面或组件。
    output: "该任务要求的前端页面或组件"

  devops:
    name: "运维工程师"
    capabilities: "执行 CEO 分配的一项部署或运维任务，配置运行环境并给出部署结果。"
    output: "部署结果"
